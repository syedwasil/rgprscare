name: rgprs_jk
description: "RGPRS J&K — offline-first organisation, grievance and membership app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local, offline-first store.
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39

  # State, navigation, QR card, settings.
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.28.2
  build_runner: ^2.4.15

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
